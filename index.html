<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Amaca</title>
    <style>
        html, body, #display {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #ffffff;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            z-index: 2;
            background: #ffffff;
            color: #303234;
            font: 18px sans-serif;
        }

        .loading-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid #d9d9d9;
            border-top-color: #647783;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #credit {
            position: fixed;
            right: 8px;
            bottom: 4px;
            z-index: 1;
            color: #6d7174;
            font: 11px sans-serif;
        }
    </style>
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
</head>
<body>
    <div id="loading" role="status" aria-live="polite">
        <div class="loading-content">
            <span class="spinner" aria-hidden="true"></span>
            <span>Loading...</span>
        </div>
    </div>
    <div id="display"></div>
    <a id="credit" href="https://cheerpj.com" target="_blank" rel="noreferrer">Powered by CheerpJ</a>

    <script type="module">
        import {joinRoom} from "https://esm.run/trystero@0.25.0";

        let room = null;
        let packetAction = null;
        let javaListener = null;
        const loading = document.getElementById("loading");
        const trysteroConfig = {appId: "io.github.arkeian.amaca"};

        if (Array.isArray(globalThis.RSA_CHAT_TURN_SERVERS) && globalThis.RSA_CHAT_TURN_SERVERS.length > 0) {
            trysteroConfig.turnConfig = globalThis.RSA_CHAT_TURN_SERVERS;
        }

        async function Java_ConnectionAdapter_registerListener(lib, listener) {
            javaListener = listener;
            return new Promise(() => {});
        }

        function Java_ConnectionAdapter_notifyApplicationLoaded() {
            loading.style.display = "none";
        }

        async function reportError(error) {
            if (javaListener) {
                await javaListener.error(String(error?.message ?? error));
            } else {
                console.error(error);
            }
        }

        async function Java_ConnectionAdapter_joinRoom(lib, roomId) {
            try {
                room?.leave();
                room = joinRoom(
                    trysteroConfig,
                    String(roomId),
                    {
                        onJoinError: details => reportError(details.error),
                        onPeerHandshake: () => {
                            if (room && Object.keys(room.getPeers()).length >= 1) {
                                throw new Error("Room already has two participants");
                            }
                        }
                    }
                );
                packetAction = room.makeAction("rsa-packet");

                room.onPeerJoin = async peerId => {
                    await javaListener?.peerConnected(peerId);
                };
                room.onPeerLeave = async peerId => {
                    await javaListener?.peerDisconnected(peerId);
                };
                packetAction.onMessage = async (packet, {peerId}) => {
                    await javaListener?.packetReceived(peerId, String(packet));
                };
            } catch (error) {
                await reportError(error);
            }
        }

        async function Java_ConnectionAdapter_sendPacket(lib, peerId, packet) {
            if (!packetAction) {
                await reportError(new Error("No room is active"));
                return;
            }

            packetAction.send(String(packet), {target: String(peerId)})
                .catch(error => reportError(error));
        }

        async function Java_ConnectionAdapter_leaveRoom() {
            room?.leave();
            room = null;
            packetAction = null;
        }

        try {
            await cheerpjInit({
                version: 17,
                natives: {
                    Java_ConnectionAdapter_registerListener,
                    Java_ConnectionAdapter_notifyApplicationLoaded,
                    Java_ConnectionAdapter_joinRoom,
                    Java_ConnectionAdapter_sendPacket,
                    Java_ConnectionAdapter_leaveRoom
                }
            });
            cheerpjCreateDisplay(-1, -1, document.getElementById("display"));

            const applicationUrl = new URL(window.location.href);
            const requestedRoom = new URLSearchParams(applicationUrl.hash.substring(1)).get("room") ?? "";
            const applicationDirectory = new URL(".", applicationUrl).pathname.replace(/\/$/, "");
            const applicationClassPath = "/app" + applicationDirectory;
            applicationUrl.search = "";
            applicationUrl.hash = "";
            await cheerpjRunMain(
                "Main",
                applicationClassPath + "/out/browser/amaca.jar:" + applicationClassPath + "/lib/zxing-core-3.5.4.jar",
                applicationUrl.href,
                requestedRoom
            );
        } catch (error) {
            loading.textContent = "Java runtime failed to load.";
            loading.style.display = "grid";
            console.error(error);
        }
    </script>
</body>
</html>
