<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Amaca</title>
    <style>
        html, body, #display {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #ffffff;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            z-index: 2;
            background: #ffffff;
            color: #303234;
            font: 18px sans-serif;
        }

        .loading-content {
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: min(520px, calc(100vw - 40px));
            text-align: center;
        }

        .spinner {
            flex: 0 0 auto;
            width: 22px;
            height: 22px;
            border: 3px solid #d9d9d9;
            border-top-color: #647783;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #credit {
            position: fixed;
            right: 8px;
            bottom: 4px;
            z-index: 1;
            color: #6d7174;
            font: 11px sans-serif;
        }
    </style>
</head>
<body>
    <div id="loading" role="status" aria-live="polite">
        <div class="loading-content">
            <span class="spinner" aria-hidden="true"></span>
            <span id="loading-message">Preparing Amaca...</span>
        </div>
    </div>
    <div id="display"></div>
    <a id="credit" href="https://cheerpj.com" target="_blank" rel="noreferrer">Powered by CheerpJ</a>

    <script type="module">
        let room = null;
        let packetAction = null;
        let javaListener = null;
        const loading = document.getElementById("loading");
        const loadingMessage = document.getElementById("loading-message");
        const spinner = loading.querySelector(".spinner");
        let startupPhase = "Loading CheerpJ Java runtime...";
        let trysteroRoomFactory = null;
        const startupTimer = window.setInterval(() => {
            if (loading.style.display !== "none") {
                loadingMessage.textContent = startupPhase + " This is taking longer than usual; check your internet connection and keep this tab open.";
            }
        }, 20_000);
        const defaultNostrRelays = [
            "wss://nos.lol",
            "wss://relay.primal.net",
            "wss://relay.snort.social",
            "wss://nostr.wine"
        ];
        const trysteroConfig = {
            appId: "io.github.arkeian.amaca",
            relayConfig: {urls: defaultNostrRelays}
        };

        async function Java_ConnectionAdapter_registerListener(lib, listener) {
            javaListener = listener;
            return new Promise(() => {});
        }

        function Java_ConnectionAdapter_notifyApplicationLoaded() {
            window.clearInterval(startupTimer);
            loading.style.display = "none";
        }

        async function loadTrysteroRoomFactory() {
            if (!trysteroRoomFactory) {
                trysteroRoomFactory = import("https://esm.run/trystero@0.25.0")
                    .then(module => module.joinRoom)
                    .catch(error => {
                        trysteroRoomFactory = null;
                        throw error;
                    });
            }
            return trysteroRoomFactory;
        }

        async function reportError(error) {
            if (javaListener) {
                await javaListener.error(String(error?.message ?? error));
            } else {
                console.error(error);
            }
        }

        async function Java_ConnectionAdapter_joinRoom(lib, roomId) {
            try {
                const joinRoom = await loadTrysteroRoomFactory();
                room?.leave();
                room = joinRoom(
                    trysteroConfig,
                    String(roomId),
                    {
                        onJoinError: details => reportError(details.error),
                        onPeerHandshake: () => {
                            if (room && Object.keys(room.getPeers()).length >= 1) {
                                throw new Error("Room already has two participants");
                            }
                        }
                    }
                );
                packetAction = room.makeAction("rsa-packet");

                room.onPeerJoin = async peerId => {
                    await javaListener?.peerConnected(peerId);
                };
                room.onPeerLeave = async peerId => {
                    await javaListener?.peerDisconnected(peerId);
                };
                packetAction.onMessage = async (packet, {peerId}) => {
                    await javaListener?.packetReceived(peerId, String(packet));
                };
            } catch (error) {
                await reportError(error);
            }
        }

        async function Java_ConnectionAdapter_sendPacket(lib, peerId, packet) {
            if (!packetAction) {
                await reportError(new Error("No room is active"));
                return;
            }

            packetAction.send(String(packet), {target: String(peerId)})
                .catch(error => reportError(error));
        }

        function copyWithLegacyClipboard(text) {
            const input = document.createElement("textarea");
            input.value = text;
            input.style.position = "fixed";
            input.style.opacity = "0";
            document.body.append(input);
            try {
                input.select();
                return document.execCommand("copy");
            } finally {
                input.remove();
            }
        }

        async function Java_ConnectionAdapter_copyText(lib, text) {
            const value = String(text);
            let copied = false;
            let errorMessage = "Clipboard access is unavailable";

            try {
                if (navigator.clipboard?.writeText) {
                    await navigator.clipboard.writeText(value);
                    copied = true;
                } else {
                    copied = copyWithLegacyClipboard(value);
                }
            } catch (error) {
                errorMessage = String(error?.message ?? error);
            }

            if (!copied) {
                try {
                    copied = copyWithLegacyClipboard(value);
                } catch (error) {
                    errorMessage = String(error?.message ?? error);
                }
            }

            if (copied) {
                await javaListener?.clipboardCopied();
            } else {
                await javaListener?.clipboardFailed(errorMessage);
            }
        }

        async function Java_ConnectionAdapter_leaveRoom() {
            room?.leave();
            room = null;
            packetAction = null;
        }

        try {
            const loaderScript = document.createElement("script");
            loaderScript.src = "https://cjrtnc.leaningtech.com/4.3/loader.js";
            const loaderReady = new Promise((resolve, reject) => {
                loaderScript.addEventListener("load", resolve, {once: true});
                loaderScript.addEventListener("error", () => reject(new Error("Could not download the CheerpJ runtime loader.")), {once: true});
            });
            document.head.append(loaderScript);
            await loaderReady;

            const configuredRelays = globalThis.RSA_CHAT_NOSTR_RELAYS;
            if (configuredRelays !== undefined) {
                if (!Array.isArray(configuredRelays)
                        || configuredRelays.length === 0
                        || !configuredRelays.every(url => typeof url === "string" && url.startsWith("wss://"))) {
                    throw new Error("RSA_CHAT_NOSTR_RELAYS must be a non-empty list of wss:// URLs");
                }
                trysteroConfig.relayConfig.urls = configuredRelays;
            }

            const turnServers = globalThis.RSA_CHAT_TURN_SERVERS;
            if (turnServers !== undefined) {
                if (!Array.isArray(turnServers) || turnServers.length === 0) {
                    throw new Error("RSA_CHAT_TURN_SERVERS must be a non-empty list of ICE server configurations");
                }
                trysteroConfig.turnConfig = turnServers;
            }

            startupPhase = "Starting the Java runtime...";
            loadingMessage.textContent = startupPhase;
            await cheerpjInit({
                version: 17,
                natives: {
                    Java_ConnectionAdapter_registerListener,
                    Java_ConnectionAdapter_notifyApplicationLoaded,
                    Java_ConnectionAdapter_joinRoom,
                    Java_ConnectionAdapter_sendPacket,
                    Java_ConnectionAdapter_copyText,
                    Java_ConnectionAdapter_leaveRoom
                }
            });
            cheerpjCreateDisplay(-1, -1, document.getElementById("display"));

            startupPhase = "Starting the Amaca application...";
            loadingMessage.textContent = startupPhase;
            const applicationUrl = new URL(window.location.href);
            const requestedRoom = new URLSearchParams(applicationUrl.hash.substring(1)).get("room") ?? "";
            const applicationDirectory = new URL(".", applicationUrl).pathname.replace(/\/$/, "");
            const applicationClassPath = "/app" + applicationDirectory;
            applicationUrl.search = "";
            applicationUrl.hash = "";
            await cheerpjRunMain(
                "Main",
                applicationClassPath + "/out/browser/amaca.jar:" + applicationClassPath + "/lib/zxing-core-3.5.4.jar",
                applicationUrl.href,
                requestedRoom
            );
        } catch (error) {
            window.clearInterval(startupTimer);
            spinner.style.display = "none";
            loadingMessage.textContent = "Amaca could not start: " + String(error?.message ?? error);
            loading.style.display = "grid";
            console.error(error);
        }
    </script>
</body>
</html>
